<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《红楼梦》人物进程线 · Demo</title>
<style>
  :root {
    --bg: #f8f7f4;
    --panel: #ffffff;
    --ink: #343a40;
    --ink-soft: #868e96;
    --line-grid: #e9e5dd;
    --accent: #b08968;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  header {
    padding: 18px 28px 12px;
    border-bottom: 1px solid #e7e2d9;
    background: var(--panel);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  header .sub { font-size: 12px; color: var(--ink-soft); }
  header .spacer { flex: 1; }
  header button {
    font-size: 12px; padding: 4px 12px; border-radius: 14px; cursor: pointer;
    border: 1px solid #d8d2c6; background: #fff; color: var(--ink);
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }

  #app { display: flex; height: calc(100vh - 62px); }

  /* 图例 */
  #legend {
    width: 216px; flex: none; order: 2;
    background: var(--panel); border-left: 1px solid #e7e2d9;
    overflow-y: auto; padding: 14px 12px;
  }
  #legend h2 { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin: 4px 6px 10px; }
  .lg-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer; user-select: none;
  }
  .lg-item:hover { background: #f4f0e8; }
  .lg-item.off { opacity: 0.35; }
  .lg-item.off .lg-name { text-decoration: line-through; }
  .lg-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
  .lg-name { font-size: 14px; }
  .lg-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 8px; flex: none;
    background: #f1ede4; color: #8a7d63;
  }
  .lg-badge.main { background: #ffe3e3; color: #c92a2a; }
  .lg-first { margin-left: auto; font-size: 10px; color: var(--ink-soft); flex: none; }

  /* 图区 */
  #chart-wrap { flex: 1; order: 1; overflow: auto; }
  svg { display: block; }

  .axis-label { font-size: 11px; fill: var(--ink-soft); }
  .char-name { font-size: 13px; font-weight: 600; }
  .char-name.minor { font-weight: 400; fill: var(--ink-soft); }
  .ev-label { font-size: 11px; fill: #6b6455; }
  .ev-label.big { font-size: 12px; font-weight: 600; fill: #4a4437; }
  .end-note { font-size: 10px; fill: var(--ink-soft); font-style: italic; }
  .node { cursor: pointer; }
  .node:hover { filter: brightness(1.15); }

  /* 悬浮提示 */
  #tooltip {
    position: fixed; display: none; z-index: 99; pointer-events: none;
    max-width: 300px; padding: 10px 12px; border-radius: 10px;
    background: rgba(33,37,41,.94); color: #f1f3f5; font-size: 12px; line-height: 1.6;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  #tooltip .t-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-chapter { color: #ffd8a8; margin-bottom: 4px; }
  #tooltip .t-chars span {
    display: inline-block; margin: 0 6px 2px 0; padding: 0 7px;
    border-radius: 9px; font-size: 11px; background: rgba(255,255,255,.14);
  }
  #tooltip .t-desc { color: #ced4da; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>《红楼梦》人物进程线</h1>
  <span class="sub">Git 分支式人物情节可视化 · 演示数据（节选回目）</span>
  <span class="spacer"></span>
  <button id="btn-all">全部显示</button>
  <button id="btn-main">仅看主角</button>
</header>

<div id="app">
  <div id="chart-wrap"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="legend"><h2>人物图例（点击显隐）</h2></aside>
</div>

<div id="tooltip"></div>

<script>
'use strict';

/* =====================================================================
 * 数据结构
 * ---------------------------------------------------------------------
 * characters[]: 人物
 *   id      唯一标识
 *   name    姓名
 *   role    main=主角(主线,加粗) / core=核心 / support=配角 / minor=次要(灰线)
 *   color   线的颜色（minor 可省略,统一灰）
 *   first   出场回目 —— 线从该时间刻度开始
 *   end     退场回目（可选）—— 线在此收尾并画终止符
 *   endNote 退场说明（可选）
 *
 * events[]: 情节事件
 *   id          唯一标识
 *   chapter     回目（时间轴坐标）
 *   title       事件名
 *   desc        事件描述（tooltip）
 *   importance  1~3,决定节点大小
 *   characters  参与人物 id 列表;多人时各线在此交汇为一个节点
 * =================================================================== */
const DATA = {
  title: '红楼梦',
  chapterMax: 120,
  characters: [
    { id: 'baoyu',    name: '贾宝玉', role: 'main',    color: '#e03131', first: 1 },
    { id: 'daiyu',    name: '林黛玉', role: 'core',    color: '#1971c2', first: 1,  end: 97,  endNote: '泪尽而逝' },
    { id: 'baochai',  name: '薛宝钗', role: 'core',    color: '#f08c00', first: 4 },
    { id: 'xifeng',   name: '王熙凤', role: 'core',    color: '#9c36b5', first: 3,  end: 114, endNote: '病逝' },
    { id: 'jiamu',    name: '贾母',   role: 'support', color: '#2f9e44', first: 3,  end: 110, endNote: '寿终' },
    { id: 'xiangyun', name: '史湘云', role: 'support', color: '#0ca678', first: 20 },
    { id: 'qingwen',  name: '晴雯',   role: 'support', color: '#d6336c', first: 8,  end: 78,  endNote: '被逐病逝' },
    { id: 'xiren',    name: '袭人',   role: 'support', color: '#e8590c', first: 5 },
    { id: 'liulaolao',name: '刘姥姥', role: 'minor',   first: 6 },
    { id: 'jiazheng', name: '贾政',   role: 'minor',   first: 33 },
    { id: 'yuanchun', name: '贾元春', role: 'minor',   first: 16, end: 95, endNote: '薨逝' },
  ],
  events: [
    { id: 'e01', chapter: 3,   importance: 3, title: '黛玉进府·宝黛初会',     characters: ['baoyu', 'daiyu', 'jiamu', 'xifeng'],
      desc: '林黛玉投奔外祖母家,与贾宝玉初见,似曾相识;王熙凤出场风头十足。' },
    { id: 'e02', chapter: 4,   importance: 2, title: '宝钗进贾府',           characters: ['baochai', 'jiamu'],
      desc: '薛宝钗随母兄入京,客居荣国府,「金玉良缘」之说渐起。' },
    { id: 'e03', chapter: 5,   importance: 2, title: '梦游太虚幻境',         characters: ['baoyu', 'xiren'],
      desc: '宝玉梦游太虚幻境,窥见金陵十二钗判词,暗示众女儿命运。' },
    { id: 'e04', chapter: 6,   importance: 2, title: '刘姥姥一进荣国府',     characters: ['liulaolao', 'xifeng'],
      desc: '刘姥姥家贫上门打秋风,王熙凤施舍二十两银子。' },
    { id: 'e05', chapter: 8,   importance: 2, title: '探宝钗·黛玉含酸',      characters: ['baoyu', 'baochai', 'daiyu', 'qingwen'],
      desc: '宝玉探视病中宝钗,比通灵、识金锁;黛玉赶来,语带机锋。' },
    { id: 'e06', chapter: 13,  importance: 3, title: '熙凤协理宁国府',       characters: ['xifeng'],
      desc: '秦可卿亡故,王熙凤受命协理宁国府丧事,才干尽显。' },
    { id: 'e07', chapter: 16,  importance: 1, title: '元春晋封贤德妃',       characters: ['yuanchun', 'jiamu'],
      desc: '贾元春晋封凤藻宫尚书,加封贤德妃,贾府权势达于顶点。' },
    { id: 'e08', chapter: 18,  importance: 3, title: '元妃省亲·游大观园',    characters: ['yuanchun', 'baoyu', 'daiyu', 'baochai', 'jiamu', 'xifeng'],
      desc: '元妃归省,大观园落成;命众姊妹与宝玉题咏,黛玉、宝钗诗才并秀。' },
    { id: 'e09', chapter: 20,  importance: 1, title: '湘云来府',             characters: ['xiangyun', 'baoyu', 'daiyu'],
      desc: '史湘云来贾府小住,心直口快,「爱哥哥」叫得黛玉微酸。' },
    { id: 'e10', chapter: 23,  importance: 3, title: '共读西厢',             characters: ['baoyu', 'daiyu'],
      desc: '宝玉携《西厢记》入大观园,与黛玉共读,以戏词试探心意。' },
    { id: 'e11', chapter: 27,  importance: 3, title: '黛玉葬花',             characters: ['daiyu', 'baoyu'],
      desc: '黛玉荷锄葬花,吟《葬花吟》;宝玉闻之恸倒,二人误会冰释。' },
    { id: 'e12', chapter: 27.5,importance: 2, title: '宝钗扑蝶',             characters: ['baochai'],
      desc: '芒种节饯花神,宝钗滴翠亭外扑蝶,无意听见小红私话。' },
    { id: 'e13', chapter: 29,  importance: 2, title: '清虚观打醮·提亲风波',  characters: ['jiamu', 'baoyu', 'daiyu', 'xiangyun'],
      desc: '张道士为宝玉提亲,贾母婉拒;宝黛因「金玉」之说大吵,宝玉砸玉。' },
    { id: 'e14', chapter: 31,  importance: 2, title: '晴雯撕扇',             characters: ['qingwen', 'baoyu'],
      desc: '宝玉为博晴雯一笑,任其撕扇,「千金难买一笑」。' },
    { id: 'e15', chapter: 33,  importance: 3, title: '宝玉挨打',             characters: ['baoyu', 'jiazheng', 'jiamu', 'daiyu', 'baochai', 'xifeng', 'xiren'],
      desc: '贾政怒笞宝玉;贾母护孙,黛玉探伤哭肿双眼,宝钗送药,袭人进言王夫人。' },
    { id: 'e16', chapter: 37,  importance: 2, title: '海棠诗社',             characters: ['baoyu', 'daiyu', 'baochai', 'xiangyun'],
      desc: '探春起社,众人咏白海棠;湘云补作夺魁,诗社雅集成大观园中一段盛景。' },
    { id: 'e17', chapter: 40,  importance: 3, title: '刘姥姥游大观园',       characters: ['liulaolao', 'jiamu', 'baoyu', 'daiyu', 'xifeng'],
      desc: '刘姥姥二进荣国府,陪贾母游宴大观园,笑话迭出,众人尽欢。' },
    { id: 'e18', chapter: 57,  importance: 2, title: '紫鹃试玉',             characters: ['daiyu', 'baoyu'],
      desc: '紫鹃谎称黛玉将回苏州,宝玉急得失心疯,宝黛之情至此无人不知。' },
    { id: 'e19', chapter: 63,  importance: 2, title: '怡红夜宴·湘云醉卧',    characters: ['xiangyun', 'baoyu', 'daiyu', 'baochai'],
      desc: '宝玉生辰,群芳夜宴掣花签;湘云醉卧芍药裀,娇憨动人。' },
    { id: 'e20', chapter: 74,  importance: 3, title: '抄检大观园',           characters: ['xifeng', 'qingwen', 'baoyu', 'xiren'],
      desc: '绣春囊事发,王熙凤带队抄检大观园;晴雯倒箱抗检,大观园由盛转衰。' },
    { id: 'e21', chapter: 78,  importance: 3, title: '晴雯之死',             characters: ['qingwen', 'baoyu'],
      desc: '晴雯被逐,抱病而亡;宝玉作《芙蓉女儿诔》祭之。' },
    { id: 'e22', chapter: 95,  importance: 1, title: '元妃薨逝',             characters: ['yuanchun', 'jiamu'],
      desc: '元春暴病薨逝,贾府失去宫中倚靠,败象渐显。' },
    { id: 'e23', chapter: 97,  importance: 3, title: '调包计·黛玉焚稿',      characters: ['daiyu', 'baoyu', 'baochai', 'xifeng', 'jiamu'],
      desc: '王熙凤设调包计,宝玉误娶宝钗;同一时刻黛玉焚稿断痴情,泪尽而逝。' },
    { id: 'e24', chapter: 110, importance: 1, title: '贾母寿终',             characters: ['jiamu'],
      desc: '贾府被抄后,贾母寿终正寝,树倒猢狲散。' },
    { id: 'e25', chapter: 113, importance: 1, title: '刘姥姥受托救巧姐',     characters: ['liulaolao', 'xifeng'],
      desc: '王熙凤临终托孤,刘姥姥感念旧恩,设法救出巧姐。' },
    { id: 'e26', chapter: 120, importance: 3, title: '宝玉出家',             characters: ['baoyu'],
      desc: '宝玉中举后随一僧一道飘然而去,白茫茫大地真干净。' },
  ],
};

/* ============================ 布局参数 ============================ */
const CFG = {
  leftPad: 130,      // 左侧留给出场人物名
  rightPad: 90,
  topPad: 92,
  laneH: 64,         // 每条人物线的纵向间距
  bottomPad: 120,    // 底部时间轴区域
  pxPerChapter: 16,
  minorColor: '#adb5bd',
};
const W = CFG.leftPad + DATA.chapterMax * CFG.pxPerChapter + CFG.rightPad;
const H = CFG.topPad + DATA.characters.length * CFG.laneH + CFG.bottomPad;

const xOf = chapter => CFG.leftPad + chapter * CFG.pxPerChapter;
const laneOf = i => CFG.topPad + i * CFG.laneH;
const colorOf = ch => ch.color || CFG.minorColor;
const strokeW = ch => ch.role === 'main' ? 4 : ch.role === 'minor' ? 2 : 2.6;
const nodeR = ev => 5 + ev.importance * 2.4;

/* 平滑曲线（Catmull-Rom 转贝塞尔） */
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i],
          p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ============================ 状态 ============================ */
const visible = new Set(DATA.characters.map(c => c.id));
let hoverChar = null;

/* ============================ 渲染 ============================ */
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';

function render() {
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.innerHTML = '';

  const chars = DATA.characters.map((c, i) => ({ ...c, lane: laneOf(i), on: visible.has(c.id) }));
  const charById = Object.fromEntries(chars.map(c => [c.id, c]));
  const axisY = CFG.topPad + chars.length * CFG.laneH + 46;

  /* --- 事件可见性 & 交汇节点纵坐标（可见参与者车道的均值） --- */
  const events = DATA.events
    .map(ev => {
      const parts = ev.characters.filter(id => charById[id] && charById[id].on);
      if (!parts.length) return null;
      const y = parts.reduce((s, id) => s + charById[id].lane, 0) / parts.length;
      return { ...ev, parts, _x: xOf(ev.chapter), _y: y };
    })
    .filter(Boolean)
    .sort((a, b) => a.chapter - b.chapter);
  const evById = Object.fromEntries(events.map(e => [e.id, e]));

  /* --- 底纹:网格线 --- */
  let g = '';
  for (let chNum = 1; chNum <= DATA.chapterMax; chNum += 10) {
    const gx = xOf(chNum);
    g += `<line x1="${gx}" y1="${CFG.topPad - 44}" x2="${gx}" y2="${axisY}" stroke="var(--line-grid)" stroke-width="1"/>`;
    g += `<text class="axis-label" x="${gx}" y="${axisY + 22}" text-anchor="middle">第${chNum}回</text>`;
  }
  /* 时间轴主线 */
  g += `<line x1="${CFG.leftPad - 60}" y1="${axisY}" x2="${W - CFG.rightPad + 40}" y2="${axisY}" stroke="#c9c2b4" stroke-width="1.5"/>`;
  g += `<text class="axis-label" x="${W - CFG.rightPad + 44}" y="${axisY + 4}">回目 →</text>`;
  /* 事件在时间轴上的刻度 */
  for (const ev of events) {
    g += `<line x1="${ev._x}" y1="${axisY - 5}" x2="${ev._x}" y2="${axisY + 5}" stroke="#b3aa97" stroke-width="1.2"/>`;
  }
  svg.innerHTML = g;

  /* --- 人物线 --- */
  const layerLines = document.createElementNS(NS, 'g');
  const layerNodes = document.createElementNS(NS, 'g');
  const layerText  = document.createElementNS(NS, 'g');
  svg.append(layerLines, layerNodes, layerText);

  for (const ch of chars) {
    if (!ch.on) continue;
    const evs = events.filter(e => e.parts.includes(ch.id));
    const color = colorOf(ch);
    const dim = hoverChar && hoverChar !== ch.id;

    /* 路径点:出场 → (中途回到车道) → 事件节点 → … → 收尾 */
    const pts = [[xOf(ch.first), ch.lane]];
    evs.forEach((ev, i) => {
      const prevX = i === 0 ? pts[0][0] : xOf(evs[i - 1].chapter);
      if (ev._x - prevX > 74) pts.push([(prevX + ev._x) / 2, ch.lane]);
      pts.push([ev._x, ev._y]);
    });
    const lastEv = evs[evs.length - 1];
    const lastChap = lastEv ? lastEv.chapter : ch.first;
    let endPt = null;
    if (ch.end && ch.end > lastChap) {
      const ex = xOf(ch.end);
      if (ex - xOf(lastChap) > 74) pts.push([(xOf(lastChap) + ex) / 2, ch.lane]);
      pts.push([ex, ch.lane]);
      endPt = [ex, ch.lane];
    } else if (lastEv) {
      pts.push([xOf(lastChap) + 46, ch.lane]);
      if (ch.end) endPt = [xOf(lastChap), lastEv._y]; // 退场即最后事件
    }

    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', smoothPath(pts));
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', strokeW(ch));
    path.setAttribute('stroke-linecap', 'round');
    if (ch.role === 'minor') path.setAttribute('stroke-dasharray', '1 0');
    if (dim) path.setAttribute('opacity', '0.12');
    layerLines.appendChild(path);

    /* 起点圆点 + 出场人物名 */
    const startDot = document.createElementNS(NS, 'circle');
    startDot.setAttribute('cx', pts[0][0]); startDot.setAttribute('cy', pts[0][1]);
    startDot.setAttribute('r', 4.5); startDot.setAttribute('fill', color);
    if (dim) startDot.setAttribute('opacity', '0.12');
    layerNodes.appendChild(startDot);

    const name = document.createElementNS(NS, 'text');
    name.setAttribute('x', pts[0][0] - 10);
    name.setAttribute('y', pts[0][1] + 4);
    name.setAttribute('text-anchor', 'end');
    name.setAttribute('class', 'char-name' + (ch.role === 'minor' ? ' minor' : ''));
    name.setAttribute('fill', ch.role === 'minor' ? '' : color);
    name.textContent = ch.name;
    if (dim) name.setAttribute('opacity', '0.12');
    layerText.appendChild(name);

    /* 退场终止符 */
    if (endPt) {
      const ring = document.createElementNS(NS, 'circle');
      ring.setAttribute('cx', endPt[0]); ring.setAttribute('cy', endPt[1]);
      ring.setAttribute('r', 6); ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', color); ring.setAttribute('stroke-width', 2);
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', endPt[0]); dot.setAttribute('cy', endPt[1]);
      dot.setAttribute('r', 2.2); dot.setAttribute('fill', color);
      layerNodes.append(ring, dot);
      if (ch.endNote) {
        const note = document.createElementNS(NS, 'text');
        note.setAttribute('x', endPt[0] + 10);
        note.setAttribute('y', endPt[1] - 8);
        note.setAttribute('class', 'end-note');
        note.textContent = ch.endNote;
        layerText.appendChild(note);
      }
    }
  }

  /* --- 事件节点(多人交汇为一个) + 事件名 --- */
  const tooltip = document.getElementById('tooltip');
  events.forEach((ev, i) => {
    const r = nodeR(ev);
    /* 节点颜色:参与者中排序最前的人物（主角优先） */
    const owner = chars.find(c => ev.parts.includes(c.id));
    const dim = hoverChar && !ev.parts.includes(hoverChar);

    const node = document.createElementNS(NS, 'circle');
    node.setAttribute('cx', ev._x); node.setAttribute('cy', ev._y);
    node.setAttribute('r', r);
    node.setAttribute('fill', colorOf(owner));
    node.setAttribute('stroke', '#fff');
    node.setAttribute('stroke-width', 2);
    node.setAttribute('class', 'node');
    if (ev.parts.length > 1) { /* 交汇节点加外圈 */
      const halo = document.createElementNS(NS, 'circle');
      halo.setAttribute('cx', ev._x); halo.setAttribute('cy', ev._y);
      halo.setAttribute('r', r + 3.5); halo.setAttribute('fill', 'none');
      halo.setAttribute('stroke', colorOf(owner));
      halo.setAttribute('stroke-width', 1);
      halo.setAttribute('opacity', dim ? '0.06' : '0.4');
      layerNodes.appendChild(halo);
    }
    if (dim) node.setAttribute('opacity', '0.12');
    layerNodes.appendChild(node);

    /* 事件名:上下交错避免重叠 */
    const up = i % 2 === 0;
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', ev._x);
    label.setAttribute('y', ev._y + (up ? -(r + 9) : r + 16));
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('class', 'ev-label' + (ev.importance >= 3 ? ' big' : ''));
    label.textContent = ev.title;
    if (dim) label.setAttribute('opacity', '0.12');
    layerText.appendChild(label);

    /* tooltip */
    node.addEventListener('mousemove', e => {
      const names = ev.characters
        .map(id => DATA.characters.find(c => c.id === id))
        .filter(Boolean)
        .map(c => `<span>${esc(c.name)}</span>`).join('');
      tooltip.innerHTML =
        `<div class="t-title">${esc(ev.title)}</div>` +
        `<div class="t-chapter">第 ${Math.floor(ev.chapter)} 回 · ${ev.characters.length > 1 ? '共同经历' : '独自经历'}</div>` +
        `<div class="t-chars">${names}</div>` +
        `<div class="t-desc">${esc(ev.desc)}</div>`;
      tooltip.style.display = 'block';
      tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 320) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    });
    node.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

/* ============================ 图例 ============================ */
const ROLE_LABEL = { main: '主角', core: '核心', support: '配角', minor: '次要' };
const legendEl = document.getElementById('legend');

function renderLegend() {
  legendEl.querySelectorAll('.lg-item').forEach(el => el.remove());
  for (const ch of DATA.characters) {
    const item = document.createElement('div');
    item.className = 'lg-item' + (visible.has(ch.id) ? '' : ' off');
    item.innerHTML =
      `<span class="lg-dot" style="background:${colorOf(ch)}"></span>` +
      `<span class="lg-name">${esc(ch.name)}</span>` +
      `<span class="lg-badge ${ch.role}">${ROLE_LABEL[ch.role]}</span>` +
      `<span class="lg-first">第${ch.first}回出场</span>`;
    item.addEventListener('click', () => {
      visible.has(ch.id) ? visible.delete(ch.id) : visible.add(ch.id);
      renderLegend(); render();
    });
    item.addEventListener('mouseenter', () => { hoverChar = ch.id; render(); });
    item.addEventListener('mouseleave', () => { hoverChar = null; render(); });
    legendEl.appendChild(item);
  }
}

document.getElementById('btn-all').addEventListener('click', () => {
  DATA.characters.forEach(c => visible.add(c.id));
  renderLegend(); render();
});
document.getElementById('btn-main').addEventListener('click', () => {
  visible.clear(); visible.add('baoyu');
  renderLegend(); render();
});

renderLegend();
render();
</script>
