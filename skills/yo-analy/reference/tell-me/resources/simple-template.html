<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[主题名] · 极简讲解</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
      padding: 2rem;
    }
    .container { max-width: 860px; margin: 0 auto; }
    header { margin-bottom: 2rem; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle { color: #64748b; margin-top: 0.5rem; font-size: 1.1rem; }
    .section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .section h2 { font-size: 1.25rem; margin-bottom: 1rem; }
    svg { width: 100%; height: auto; display: block; }
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .step-card {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      padding: 1rem;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .step-card h3 { font-size: 1rem; margin-bottom: 0.25rem; }
    .step-card p { color: #475569; font-size: 0.9rem; }
    .analogy {
      background: #fce7f3;
      border: 1px solid #f9a8d4;
      border-radius: 0.75rem;
      padding: 1rem;
      font-size: 1rem;
    }
    .analogy b { color: #db2777; }
    .takeaway {
      background: #ecfeff;
      border: 1px solid #67e8f9;
      border-radius: 0.75rem;
      padding: 1rem;
    }
    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 0.8rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>[主题名]</h1>
      <p class="subtitle">一句话概括：这是干嘛的。</p>
    </header>

    <!-- 核心概念图 -->
    <div class="section">
      <h2>是什么？</h2>
      <svg viewBox="0 0 800 300">
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
          </marker>
        </defs>

        <!-- 用简单方框 + 箭头画核心概念 -->
        <rect x="40" y="120" width="180" height="80" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="130" y="165" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">概念 A</text>

        <line x1="220" y1="160" x2="298" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

        <rect x="300" y="120" width="180" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
        <text x="390" y="165" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">概念 B</text>
      </svg>
    </div>

    <!-- 分步：怎么工作 -->
    <div class="section">
      <h2>怎么工作？</h2>
      <div class="steps">
        <div class="step-card">
          <div class="step-num">1</div>
          <h3>第一步</h3>
          <p>一句话说明这一步。</p>
        </div>
        <div class="step-card">
          <div class="step-num">2</div>
          <h3>第二步</h3>
          <p>一句话说明这一步。</p>
        </div>
        <div class="step-card">
          <div class="step-num">3</div>
          <h3>第三步</h3>
          <p>一句话说明这一步。</p>
        </div>
      </div>
    </div>

    <!-- 类比 -->
    <div class="section">
      <h2>打个比方</h2>
      <p class="analogy">这就像 <b>[日常事物]</b>，因为 <b>[共同点]</b>。</p>
    </div>

    <!-- 小结 -->
    <div class="section">
      <h2>记住一句话</h2>
      <p class="takeaway">[一句话 takeaways]</p>
    </div>

    <footer>[主题名] · 极简讲解</footer>
  </div>
</body>
</html>
